<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aurixa Systems">
  <title>Aurixa Systems</title>
  <!--
    The 16/32px variant. Same delta geometry as `aurixa-mark.svg`, with
    everything that becomes noise at that scale removed: no orbital rings, no
    warm bloom, no hairline speculars. The blades keep their two-face chisel
    because that is what stops the shape reading as a flat sticker, but the
    core is enlarged and the field flattened so the silhouette survives being
    resampled to sixteen pixels.
  -->
  <defs>
    <linearGradient id="axc-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122C52"/>
      <stop offset="100%" stop-color="#071228"/>
    </linearGradient>

    <linearGradient id="axc-gold-lit" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#FFF4D2"/>
      <stop offset="45%" stop-color="#F0CE85"/>
      <stop offset="100%" stop-color="#D3A44C"/>
    </linearGradient>

    <linearGradient id="axc-gold-shade" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#B07E32"/>
      <stop offset="100%" stop-color="#87601F"/>
    </linearGradient>

    <radialGradient id="axc-orb" cx="36%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#EFFCFF"/>
      <stop offset="26%" stop-color="#7FDBFF"/>
      <stop offset="60%" stop-color="#2585E4"/>
      <stop offset="100%" stop-color="#08326E"/>
    </radialGradient>

    <mask id="axc-delta">
      <rect width="512" height="512" fill="#000000"/>
      <path d="M256 54 L474 442 L38 442 Z" fill="#FFFFFF"/>
      <path d="M256 160 L385 390 L127 390 Z" fill="#000000"/>
      <path d="M256 296 L326 442 L186 442 Z" fill="#000000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#axc-field)"/>

  <g mask="url(#axc-delta)">
    <path d="M256 54 L256 107 L82 416 L38 442 Z" fill="url(#axc-gold-lit)"/>
    <path d="M256 107 L256 160 L127 390 L82 416 Z" fill="url(#axc-gold-shade)"/>
    <path d="M256 54 L474 442 L430 416 L256 107 Z" fill="url(#axc-gold-shade)"/>
    <path d="M256 107 L430 416 L385 390 L256 160 Z" fill="url(#axc-gold-lit)"/>
    <path d="M82 416 L430 416 L385 390 L127 390 Z" fill="url(#axc-gold-lit)"/>
    <path d="M38 442 L474 442 L430 416 L82 416 Z" fill="url(#axc-gold-shade)"/>
  </g>

  <circle cx="256" cy="290" r="70" fill="url(#axc-orb)"/>
  <ellipse cx="232" cy="264" rx="24" ry="16" fill="#FFFFFF" opacity="0.7" transform="rotate(-32 232 264)"/>
</svg>
