name: PDF Import Release Gate

# Phase 11D release gate: static, local/CI-safe checks only. No secrets, no
# Supabase SQL, no Cloud Run access, no deployment, no AI. Live checks are
# disabled by default and are opt-in via PDF_IMPORT_ENABLE_LIVE_CHECKS.

on:
  pull_request:
    paths:
      - 'src/lib/reportTemplate/**'
      - 'src/components/admin/pdfImport/**'
      - 'src/pages/admin/**'
      - 'docs/pdf-import/**'
      - 'scripts/regression/**'
      - 'supabase/functions/pdf-import-monitoring/**'
      # The two halves of the engine-lockstep contract. Either one moving alone
      # is exactly the defect the lockstep step below refuses.
      - 'pdf-parse-service/**'
      - 'supabase/functions/pdf-parse-dispatch/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/pdf-import-release-gate.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pdf-import-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-import-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the gate can diff the checked-out commit from the
          # PR base or pre-push commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Before `npm install`, because it needs nothing installed and because it
      # is the cheapest check here. The sidecar image and `pdf-parse-dispatch`
      # share a cache fingerprint: if one ships without the other, the
      # dispatcher serves artifacts built under the OLD semantics under a
      # CURRENT key, and a cache hit means nothing downstream ever runs to
      # notice. Catching that on the pull request is the difference between a
      # failed check and a silently poisoned cache (LANE-POLICY.md G3).
      - name: The sidecar and the dispatcher agree about the engine
        run: |
          node scripts/regression/pdf-parse-engine-lockstep.mjs --selftest
          node scripts/regression/pdf-parse-engine-lockstep.mjs --static

      # Matches the repo's existing ci.yml: `npm ci` is intentionally NOT used
      # because the committed package-lock.json is out of sync with package.json
      # on main. `npm install` reconciles the lockfile and installs.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run PDF import release gate (static)
        env:
          PDF_IMPORT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run pdf-import:release-gate:static

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-import-release-gate-report
          path: reports/pdf-import-release-gate/
          if-no-files-found: ignore
